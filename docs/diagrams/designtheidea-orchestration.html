<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>design-the-idea orchestration</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@400;600&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
  <style>*{box-sizing:border-box}body{margin:0;padding:32px;background:#f2f2f3;color:#1d1f20;font-family:Barlow,sans-serif}main{max-width:1280px;margin:auto}p{margin:0 0 8px;color:#5d5d60;font:500 12px ui-monospace,Menlo,monospace;letter-spacing:.12em;text-transform:uppercase}h1{margin:0 0 24px;font:600 32px "Barlow Condensed",sans-serif}svg{width:100%;min-width:960px;display:block}</style>
</head>
<body><main><p>Step 4 · Claude Design</p><h1>A single Fable session turns visual evidence into visual critique</h1>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="designtheidea-orchestration-title designtheidea-orchestration-desc">
  <title id="designtheidea-orchestration-title">design-the-idea orchestration</title>
  <desc id="designtheidea-orchestration-desc">A five-stage process shows screenshot evidence being classified, compared, reviewed for standalone bugs, synthesized, and emitted as a new Claude Design turn without subagents.</desc>
  <defs>
    <style>
      .node{fill:#fff;stroke:#1d1f20;stroke-width:1}.input{fill:#e9e9ea;stroke:#7a7a7d}.focal{fill:#5980a6;fill-opacity:.10;stroke:#5980a6;stroke-width:1.2}.line{fill:none;stroke:#5d5d60;stroke-width:1.2}
      .label{fill:#1d1f20;font:600 12px Barlow,sans-serif;text-anchor:middle}.sub{fill:#5d5d60;font:400 8px ui-monospace,Menlo,monospace;text-anchor:middle}.tag{fill:#5d5d60;font:500 8px ui-monospace,Menlo,monospace;letter-spacing:.12em;text-anchor:middle}.step{fill:#416180;font:600 8px ui-monospace,Menlo,monospace;text-anchor:middle}
    </style>
    <marker id="design-idea-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#5d5d60"/></marker>
  </defs>
  <rect width="1280" height="720" fill="#f2f2f3"/>
  <rect x="472" y="112" width="336" height="40" rx="4" fill="#e9e9ea" stroke="#b7b7ba" stroke-width="0.8"/><text class="tag" x="640" y="136">FABLE 5.1 · ONE CLAUDE DESIGN SESSION · 0 SUBAGENTS</text>

  <line class="line" x1="264" y1="320" x2="296" y2="320" marker-end="url(#design-idea-arrow)"/><line class="line" x1="496" y1="320" x2="528" y2="320" marker-end="url(#design-idea-arrow)"/><line class="line" x1="728" y1="320" x2="760" y2="320" marker-end="url(#design-idea-arrow)"/><line class="line" x1="960" y1="320" x2="992" y2="320" marker-end="url(#design-idea-arrow)"/>

  <g><rect class="input" x="64" y="248" width="200" height="144" rx="8"/><text class="step" x="164" y="276">INPUT BUNDLE</text><text class="label" x="164" y="308"><tspan x="164">Prompt + 16</tspan><tspan x="164" dy="16">screenshots</tspan></text><text class="sub" x="164" y="352">6 CURRENT/FUTURE pairs</text><text class="sub" x="164" y="372">+ 4 BUG screenshots</text></g>
  <g><rect class="node" x="296" y="248" width="200" height="144" rx="8"/><text class="step" x="396" y="276">CLASSIFY</text><text class="label" x="396" y="308"><tspan x="396">Group by filename</tspan><tspan x="396" dy="16">and screen area</tspan></text><text class="sub" x="396" y="352">6 pairs · 4 bugs</text><text class="sub" x="396" y="372">no issue omitted</text></g>
  <g><rect class="node" x="528" y="248" width="200" height="144" rx="8"/><text class="step" x="628" y="276">COMPARE</text><text class="label" x="628" y="308"><tspan x="628">Current → future</tspan><tspan x="628" dy="16">for every pair</tspan></text><text class="sub" x="628" y="352">layout · behavior · hierarchy</text><text class="sub" x="628" y="372">identify the delta</text></g>
  <g><rect class="node" x="760" y="248" width="200" height="144" rx="8"/><text class="step" x="860" y="276">DIAGNOSE</text><text class="label" x="860" y="308"><tspan x="860">Inspect standalone</tspan><tspan x="860" dy="16">bug evidence</tspan></text><text class="sub" x="860" y="352">textarea sizing</text><text class="sub" x="860" y="372">trace overlap</text></g>
  <g><rect class="focal" x="992" y="248" width="200" height="144" rx="8"/><text class="step" x="1092" y="276">OUTPUT</text><text class="label" x="1092" y="308"><tspan x="1092">Synthesize a new</tspan><tspan x="1092" dy="16">Claude Design turn</tspan></text><text class="sub" x="1092" y="352">detailed critique diagrams</text><text class="sub" x="1092" y="372">handoff to Step 5</text></g>

  <line x1="40" y1="660" x2="1240" y2="660" stroke="#b7b7ba" stroke-width="0.8"/><text class="tag" x="640" y="688">THIS IS A SINGLE-AGENT VISUAL REASONING PASS—not A CLAUDE CODE FAN-OUT</text>
</svg></main></body></html>
