<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ideatoplan-orchestration-title ideatoplan-orchestration-desc">
  <title id="ideatoplan-orchestration-title">idea-to-plan orchestration</title>
  <desc id="ideatoplan-orchestration-desc">Sonnet agents survey repositories and research the request in parallel, Opus synthesizes and critiques the design, Sonnet judges revisions, and Opus produces the final plan.</desc>
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Barlow+Condensed:wght@400;600&amp;family=Instrument+Serif:ital@1&amp;display=swap');</style>
    <style>
      .lane-a{fill:#e9e9ea;fill-opacity:.44}.lane-b{fill:#fff;fill-opacity:.44}.node{fill:#fff;stroke:#1d1f20;stroke-width:1}.focal{fill:#5980a6;fill-opacity:.10;stroke:#5980a6;stroke-width:1.2}.optional{fill:#f2f2f3;stroke:#7a7a7d;stroke-width:1;stroke-dasharray:4 3}
      .label{fill:#1d1f20;font:600 12px Barlow,sans-serif;text-anchor:middle}.sub{fill:#5d5d60;font:400 8px ui-monospace,Menlo,monospace;text-anchor:middle}.tag{fill:#5d5d60;font:500 8px ui-monospace,Menlo,monospace;letter-spacing:.12em;text-anchor:middle}.lane{fill:#416180;font:600 12px 'Barlow Condensed',sans-serif;text-anchor:middle}.line{fill:none;stroke:#5d5d60;stroke-width:1.2}.dashed{fill:none;stroke:#7a7a7d;stroke-width:1;stroke-dasharray:5 4}
    </style>
    <marker id="idea-plan-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#5d5d60"/></marker>
  </defs>
  <rect width="1280" height="720" fill="#f2f2f3"/><rect class="lane-a" x="40" y="120" width="1200" height="192"/><rect class="lane-b" x="40" y="312" width="1200" height="304"/>
  <line x1="40" y1="120" x2="1240" y2="120" stroke="#b7b7ba" stroke-width="0.8"/><line x1="40" y1="312" x2="1240" y2="312" stroke="#b7b7ba" stroke-width="0.8"/><line x1="40" y1="616" x2="1240" y2="616" stroke="#b7b7ba" stroke-width="0.8"/>
  <text class="lane" x="108" y="144">SONNET</text><text class="lane" x="108" y="336">OPUS</text>

  <line class="line" x1="216" y1="184" x2="240" y2="184" marker-end="url(#idea-plan-arrow)"/>
  <path class="line" d="M216 264 H444 Q452 264 452 272 V376" marker-end="url(#idea-plan-arrow)"/>
  <path class="line" d="M380 184 H488 Q496 184 496 192 V376" marker-end="url(#idea-plan-arrow)"/>
  <line class="line" x1="544" y1="408" x2="568" y2="408" marker-end="url(#idea-plan-arrow)"/>
  <path class="line" d="M708 408 H792 Q800 408 800 400 V216" marker-end="url(#idea-plan-arrow)"/>
  <line class="line" x1="872" y1="184" x2="896" y2="184" marker-end="url(#idea-plan-arrow)"/>
  <path class="line" d="M1036 176 H1104 Q1112 176 1112 184 V376" marker-end="url(#idea-plan-arrow)"/>
  <line class="line" x1="1130" y1="440" x2="1130" y2="472" marker-end="url(#idea-plan-arrow)"/>
  <path class="dashed" d="M1036 196 H1224 Q1232 196 1232 204 V496 Q1232 504 1224 504 H1200" marker-end="url(#idea-plan-arrow)"/>

  <g><rect class="node" x="76" y="152" width="140" height="64" rx="8"/><text class="label" x="146" y="176">Repo surveys ×7</text><text class="sub" x="146" y="196">scratch/step1-*.md</text></g>
  <g><rect class="node" x="76" y="232" width="140" height="64" rx="8"/><text class="label" x="146" y="256">Request research</text><text class="sub" x="146" y="276">Design + web context</text></g>
  <g><rect class="node" x="240" y="152" width="140" height="64" rx="8"/><text class="label" x="310" y="176">Current model</text><text class="sub" x="310" y="196">current-design.md</text></g>
  <g><rect class="node" x="404" y="376" width="140" height="64" rx="8"/><text class="label" x="474" y="400">Design delta</text><text class="sub" x="474" y="420">design-delta.md</text></g>
  <g><rect class="node" x="568" y="376" width="140" height="64" rx="8"/><text class="label" x="638" y="400">Critique delta</text><text class="sub" x="638" y="420">numbered revisions</text></g>
  <g><rect class="node" x="732" y="152" width="140" height="64" rx="8"/><text class="label" x="802" y="176">Judges ×2</text><text class="sub" x="802" y="196">validity ∥ necessity</text></g>
  <g><rect class="focal" x="896" y="152" width="140" height="64" rx="8"/><text class="label" x="966" y="176">Intersection</text><text class="sub" x="966" y="196">valid ∩ necessary</text></g>
  <g><rect class="optional" x="1060" y="376" width="140" height="64" rx="8"/><text class="label" x="1130" y="400">Revise delta</text><text class="sub" x="1130" y="420">optional · Opus</text></g>
  <g><rect class="node" x="1060" y="472" width="140" height="64" rx="8"/><text class="label" x="1130" y="496">Build plan</text><text class="sub" x="1130" y="516">design-docs/plan.md</text></g>

  <text class="tag" x="640" y="580">15 AGENT ASSIGNMENTS · 16 WHEN THE OPTIONAL REVISION RUNS · MAX FAN-OUT 8</text>
  <line x1="40" y1="660" x2="1240" y2="660" stroke="#b7b7ba" stroke-width="0.8"/><text class="tag" x="352" y="688">SOLID · REQUIRED HANDOFF</text><text class="tag" x="832" y="688">DASHED · SKIP REVISION WHEN INTERSECTION IS EMPTY</text>
</svg>
